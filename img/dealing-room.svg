<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="drBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081021"/>
      <stop offset="50%" stop-color="#132038"/>
      <stop offset="100%" stop-color="#060B17"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#151F28"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#drBg)"/>

  <!-- Console Surface -->
  <polygon points="40,410 760,410 800,600 0,600" fill="url(#deskGrad)"/>
  <line x1="40" y1="410" x2="760" y2="410" stroke="#00A4EF" stroke-width="2" opacity="0.7"/>

  <!-- Multi-monitor Trading Setup -->
  <!-- Left Screen -->
  <polygon points="80,240 270,220 270,380 80,385" fill="#0D1624" stroke="#2C3E50" stroke-width="4"/>
  <polygon points="90,250 260,232 260,370 90,375" fill="#070E18"/>
  <polyline points="95,350 135,320 175,335 215,290 255,265" fill="none" stroke="#00FF87" stroke-width="3"/>
  <polyline points="95,365 140,355 185,340 225,350 255,330" fill="none" stroke="#FF5A5F" stroke-width="2"/>

  <!-- Center Screen -->
  <rect x="285" y="190" width="230" height="190" rx="5" fill="#0D1624" stroke="#00A4EF" stroke-width="3"/>
  <rect x="293" y="198" width="214" height="174" rx="3" fill="#081220"/>
  <!-- Financial Candle bars -->
  <rect x="310" y="250" width="11" height="70" fill="#00FF87"/>
  <line x1="315" y1="235" x2="315" y2="335" stroke="#00FF87" stroke-width="1.5"/>
  <rect x="332" y="270" width="11" height="50" fill="#FF5A5F"/>
  <line x1="337" y1="260" x2="337" y2="330" stroke="#FF5A5F" stroke-width="1.5"/>
  <rect x="354" y="230" width="11" height="95" fill="#00FF87"/>
  <line x1="359" y1="220" x2="359" y2="335" stroke="#00FF87" stroke-width="1.5"/>
  <rect x="376" y="240" width="11" height="65" fill="#00FF87"/>
  <rect x="398" y="265" width="11" height="45" fill="#FF5A5F"/>
  <rect x="420" y="235" width="11" height="80" fill="#00FF87"/>
  <rect x="442" y="225" width="11" height="95" fill="#00FF87"/>
  <polyline points="300,300 350,280 400,300 450,250 495,240" fill="none" stroke="#FFD166" stroke-width="2.5"/>

  <!-- Right Screen -->
  <polygon points="530,220 720,240 720,385 530,380" fill="#0D1624" stroke="#2C3E50" stroke-width="4"/>
  <polygon points="540,232 710,250 710,375 540,370" fill="#070E18"/>
  <line x1="550" y1="300" x2="700" y2="300" stroke="#1F2F44" stroke-width="1"/>
  <line x1="550" y1="330" x2="700" y2="330" stroke="#1F2F44" stroke-width="1"/>
  <polyline points="545,350 585,330 625,310 665,325 700,280" fill="none" stroke="#00E5FF" stroke-width="3"/>

  <!-- Trader Keyboards on Desk -->
  <polygon points="310,430 490,430 510,465 290,465" fill="#151F2B" stroke="#2C3E50" stroke-width="1"/>
</svg>